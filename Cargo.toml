[package]
name = "hpxctl"
version = "0.9.2"
edition = "2024"
description = """
HTTP control server for Carestream HPX detectors.
NOT FOR MEDICAL USE
"""
authors = ["Tom Powell <tpowell1@mines.edu>"]
license = "custom"
readme = "README.md"

[dependencies]
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
uuid = {version = "1.17.0", features = ["serde"]}
log = "0.4.21"
colog = "1.3.0"
env_logger = "0.11.8"
socket2 = "0.6.1"
pnet = "0.35.0"
stdext = "0.3.3"
rand = "0.9.2"
whoami = "2.0.2"
toml = "0.9.11"

[lints.clippy]
needless_return = "allow"
missing_const_for_fn = "warn"
unused_unit = "allow"

[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
